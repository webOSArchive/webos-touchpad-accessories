# >>> btgamepad begin -- do not edit between the markers
# Gamepad nodes for jailed PDK apps (TouchPad Go / opal).
# Spliced into /etc/jail_pdk.conf immediately after "mkdir /dev".
#
# These are jailer verbs, NOT shell. "mknod <path> c <major> <minor>" creates
# the node inside the jail with permission bits 0, hence the chmod after each.
# Input event devices are char major 13, minor 64+N.
#
# Deliberately NOT "mount ro /dev/input": that is a real bind mount of the
# host's /dev/input into the jail (see docs/PDK-GRAPHICS-REGRESSION.md). It
# blacks out PDK games on the Go, and it lets anything that deletes a jail
# directory delete the device's real input nodes. mknod creates independent
# nodes -- nothing on the host is referenced, so nothing on the host can be
# damaged.
#
# event0-2 are the built-in gpio-keys / power key / headset; they are left out
# on purpose so jailed apps cannot read the system buttons. event3-9 covers the
# shim's uinput pad plus any USB HID that claimed a minor ahead of it. A node
# whose minor has no device behind it just fails open() with ENODEV, which is
# what every evdev scanner already handles.
mkdir /dev/input
chmod 755 /dev/input
mknod /dev/input/event3 c 13 67
chmod 666 /dev/input/event3
mknod /dev/input/event4 c 13 68
chmod 666 /dev/input/event4
mknod /dev/input/event5 c 13 69
chmod 666 /dev/input/event5
mknod /dev/input/event6 c 13 70
chmod 666 /dev/input/event6
mknod /dev/input/event7 c 13 71
chmod 666 /dev/input/event7
mknod /dev/input/event8 c 13 72
chmod 666 /dev/input/event8
mknod /dev/input/event9 c 13 73
chmod 666 /dev/input/event9
# <<< btgamepad end
